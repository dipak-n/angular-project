<div class="container">

  <h2>Employee Profile</h2>


  <form [formGroup]="employeeForm">


    <!-- ====================================================== -->
    <!-- NAME -->
    <!-- ====================================================== -->

    <div class="form-group">

      <label>Employee Name</label>

      <input
        type="text"
        formControlName="name"
        placeholder="Enter employee name"
      />

      <small
        *ngIf="
          employeeForm.get('name')?.touched &&
          employeeForm.get('name')?.invalid
        "
      >
        Name is required
      </small>

    </div>


    <!-- ====================================================== -->
    <!-- EMAIL -->
    <!-- ====================================================== -->

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        formControlName="email"
        placeholder="Enter email"
      />

      <small
        *ngIf="
          employeeForm.get('email')?.touched &&
          employeeForm.get('email')?.invalid
        "
      >
        Enter a valid email
      </small>

    </div>


    <!-- ====================================================== -->
    <!-- DEPARTMENT -->
    <!-- ====================================================== -->

    <div class="form-group">

      <label>Department</label>

      <select formControlName="department">

        <option value="">
          Select Department
        </option>

        <option value="IT">
          IT
        </option>

        <option value="HR">
          HR
        </option>

        <option value="Finance">
          Finance
        </option>

        <option value="Sales">
          Sales
        </option>

      </select>

    </div>


    <!-- ====================================================== -->
    <!-- SALARY -->
    <!-- ====================================================== -->

    <div class="form-group">

      <label>Salary</label>

      <input
        type="number"
        formControlName="salary"
        placeholder="Enter salary"
      />

    </div>


    <!-- ====================================================== -->
    <!-- STATUS -->
    <!-- ====================================================== -->

    <div class="status">

      <span *ngIf="saveStatus === 'Saving...'">
        Saving...
      </span>

      <span *ngIf="saveStatus === 'Saved'">
        Saved ✓
      </span>

      <span *ngIf="saveStatus === 'Error while saving'">
        Error while saving
      </span>

    </div>


    <!-- ====================================================== -->
    <!-- RESET -->
    <!-- ====================================================== -->

    <button
      type="button"
      (click)="resetForm()"
    >
      Reset
    </button>

  </form>

</div>
